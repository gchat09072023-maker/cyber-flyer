    <meta property="og:title" content="Cyber Flyer - 3D Cyberpunk Flying Car Simulator" />
    <meta property="og:description" content="High-speed ground racing and seamless aerial flight simulation in a neon cyberpunk metropolis with procedural audio, missions, and responsive mobile controls." />

    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Vite WebSocket Reconnection Guard
      // Suppresses background WebSocket dropouts and unhandled rejection errors in hosted container environments
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          if (
            (reason instanceof Event && (reason.type === 'error' || (window.WebSocket && reason.target instanceof WebSocket))) ||
            (reason && typeof reason.message === 'string' && (
              reason.message.indexOf('WebSocket') !== -1 ||
              reason.message.indexOf('vite') !== -1 ||
              reason.message.indexOf('ws://') !== -1 ||
              reason.message.indexOf('wss://') !== -1
            ))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        });
        window.addEventListener('error', function(event) {
          if (
            (window.WebSocket && event.target instanceof WebSocket) ||
            (event.message && (
              event.message.indexOf('WebSocket') !== -1 ||
              event.message.indexOf('vite') !== -1
            ))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation && event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
