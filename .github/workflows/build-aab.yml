name: Build Android AAB Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Native Android Project Files
        run: |
          mkdir -p android/app/src/main/java/com/cyberflyer/game
          mkdir -p android/app/src/main/res/values

          # 1. Strings
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Cyber Flyer</string>
          </resources>
          EOF

          # 2. Root build.gradle
          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 3. settings.gradle
          cat << 'EOF' > android/settings.gradle
          rootProject.name = "CyberFlyer"
          include ':app'
          EOF

          # 4. Generate Release Keystore
          keytool -genkeypair -v -keystore android/app/release.keystore -alias cyberflyer -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=CyberFlyer, OU=Gaming, O=Studio, L=City, S=State, C=IN"

          # 5. app/build.gradle
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.cyberflyer.game'
              compileSdk 34

              defaultConfig {
                  applicationId "com.cyberflyer.game"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword "123456"
                      keyAlias "cyberflyer"
                      keyPassword "123456"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
          }
          EOF

          # 6. AndroidManifest.xml (AdMob App ID Configuration)
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-7567486237342194~3347511713"/>
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 7. MainActivity.java (AdMob Interstitial Ad Integrated)
          cat << 'EOF' > android/app/src/main/java/com/cyberflyer/game/MainActivity.java
          package com.cyberflyer.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.RelativeLayout;
          import androidx.annotation.NonNull;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.LoadAdError;
          import com.google.android.gms.ads.MobileAds;
          import com.google.android.gms.ads.interstitial.InterstitialAd;
          import com.google.android.gms.ads.interstitial.InterstitialAdLoadCallback;

          public class MainActivity extends Activity {
              private WebView webView;
              private InterstitialAd mInterstitialAd;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  RelativeLayout layout = new RelativeLayout(this);

                  // 1. WebView Game Setup
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://cyber-flyer.vercel.app");

                  RelativeLayout.LayoutParams webParams = new RelativeLayout.LayoutParams(
                          RelativeLayout.LayoutParams.MATCH_PARENT, RelativeLayout.LayoutParams.MATCH_PARENT);
                  layout.addView(webView, webParams);

                  // 2. Initialize AdMob and Load Interstitial Ad
                  MobileAds.initialize(this, initializationStatus -> {});
                  loadInterstitialAd();

                  setContentView(layout);
              }

              private void loadInterstitialAd() {
                  AdRequest adRequest = new AdRequest.Builder().build();
                  InterstitialAd.load(this, "ca-app-pub-7567486237342194/2588775869", adRequest,
                          new InterstitialAdLoadCallback() {
                              @Override
                              public void onAdLoaded(@NonNull InterstitialAd interstitialAd) {
                                  mInterstitialAd = interstitialAd;
                              }

                              @Override
                              public void onAdFailedToLoad(@NonNull LoadAdError loadAdError) {
                                  mInterstitialAd = null;
                              }
                          });
              }

              @Override
              public void onBackPressed() {
                  if (mInterstitialAd != null) {
                      mInterstitialAd.show(this);
                      loadInterstitialAd();
                  } else if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Android Bundle (AAB)
        run: |
          cd android
          gradle bundleRelease --stacktrace

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: CyberFlyer-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/*.aab
