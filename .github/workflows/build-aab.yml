name: Build Android AAB Bundle

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Native Android Project Structure
        run: |
          mkdir -p android/app/src/main/java/com/cyberflyer/game
          mkdir -p android/app/src/main/res/values

          # 1. Root build.gradle
          cat << 'EOF' > android/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # 2. settings.gradle
          cat << 'EOF' > android/settings.gradle
          rootProject.name = "CyberFlyer"
          include ':app'
          EOF

          # 3. app/build.gradle
          cat << 'EOF' > android/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.cyberflyer.game'
              compileSdk 34
              defaultConfig {
                  applicationId "com.cyberflyer.game"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-ads:23.0.0'
          }
          EOF

          # 4. AndroidManifest.xml
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:allowBackup="true"
                  android:label="Cyber Flyer"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                  <meta-data
                      android:name="com.google.android.gms.ads.APPLICATION_ID"
                      android:value="ca-app-pub-3940256099942544~3347511713"/>
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # 5. MainActivity.java
          cat << 'EOF' > android/app/src/main/java/com/cyberflyer/game/MainActivity.java
          package com.cyberflyer.game;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.RelativeLayout;
          import com.google.android.gms.ads.AdRequest;
          import com.google.android.gms.ads.AdSize;
          import com.google.android.gms.ads.AdView;
          import com.google.android.gms.ads.MobileAds;

          public class MainActivity extends Activity {
              private WebView webView;
              private AdView adView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  RelativeLayout layout = new RelativeLayout(this);

                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("https://cyber-flyer.vercel.app");

                  RelativeLayout.LayoutParams webParams = new RelativeLayout.LayoutParams(
                          RelativeLayout.LayoutParams.MATCH_PARENT, RelativeLayout.LayoutParams.MATCH_PARENT);
                  layout.addView(webView, webParams);

                  MobileAds.initialize(this, initializationStatus -> {});
                  adView = new AdView(this);
                  adView.setAdSize(AdSize.BANNER);
                  adView.setAdUnitId("ca-app-pub-3940256099942544/6300978111");

                  RelativeLayout.LayoutParams adParams = new RelativeLayout.LayoutParams(
                          RelativeLayout.LayoutParams.WRAP_CONTENT, RelativeLayout.LayoutParams.WRAP_CONTENT);
                  adParams.addRule(RelativeLayout.ALIGN_PARENT_BOTTOM);
                  adParams.addRule(RelativeLayout.CENTER_HORIZONTAL);
                  layout.addView(adView, adParams);

                  AdRequest adRequest = new AdRequest.Builder().build();
                  adView.loadAd(adRequest);

                  setContentView(layout);
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Build Android App Bundle (AAB)
        run: |
          cd android
          gradle bundleRelease

      - name: Upload Signed/Release Bundle
        uses: actions/upload-artifact@v4
        with:
          name: CyberFlyer-Release-Bundle
          path: android/app/build/outputs/bundle/release/*.aab
